spring:
  application:
    name: ym-pf-backend
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: ${PORT:8080}

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ym-pf}
    audience: ${JWT_AUDIENCE:ym-pf-admin}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    access-cookie-name: ${ACCESS_COOKIE_NAME:ympf_access}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:ympf_refresh}
    access-cookie-path: ${ACCESS_COOKIE_PATH:/}
    refresh-cookie-path: ${REFRESH_COOKIE_PATH:/api/auth}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  web:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  media:
    provider: ${MEDIA_STORAGE_PROVIDER:local}
    local-path: ${MEDIA_STORAGE_LOCAL_PATH:./data/media}
    bucket: ${MEDIA_STORAGE_BUCKET:}
    region: ${MEDIA_STORAGE_REGION:ap-northeast-2}
    endpoint: ${MEDIA_STORAGE_ENDPOINT:}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:5242880}
    max-width: ${MEDIA_MAX_WIDTH:8000}
    max-height: ${MEDIA_MAX_HEIGHT:8000}
  resume-pdf:
    font-path: ${RESUME_PDF_FONT_PATH:}

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 6MB
